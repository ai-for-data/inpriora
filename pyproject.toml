[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inpriora"
version = "0.1.0"
description = "Pretrained tabular foundation model for classification and regression"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4",
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.3,<2",
    "pandas>=1.5",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["ruff", "build"]
triton = ["triton>=3.0"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
